<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Balloon Birthday Wish</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0d1a;
            font-family: 'Arial', sans-serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const colors = ['#FF5733', '#F39C12', '#F1C40F', '#2ECC71', '#1ABC9C', '#3498DB', '#9B59B6', '#E91E63', '#FF4081'];

        // মেসেজ টেক্সট ২ টি দৃশ্যে বিভক্ত
        const scene1 = [
            "HAPPY",
            "BIRTHDAY!",
            "DEAR TASPIYA"
        ];

        const scene2 = [
            "MANY MANY RETURNS",
            "OF THE DAY",
            "DEAR BOW JAN UMMMAAHH ❤️"
        ];

        let balloons = [];
        let particles = [];
        let currentScene = 1;

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 2 + 1;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = Math.random() * 2 + 1;
                this.alpha = 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.02;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(this.alpha, 0);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class Balloon {
            constructor(char, targetX, targetY, delay) {
                this.char = char;
                this.targetX = targetX;
                this.targetY = targetY;
                
                // শুরুতে স্ক্রিনের নিচে থেকে স্পন হবে
                this.x = targetX + (Math.random() - 0.5) * 200;
                this.y = height + 100 + Math.random() * 300;
                
                this.radius = Math.min(width, height) < 600 ? 16 : 22;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                
                this.speedY = Math.random() * 2 + 3;
                this.angle = Math.random() * Math.PI * 2;
                this.swing = Math.random() * 2 + 1;
                
                this.arrived = false;
                this.delay = delay;
                this.spawned = false;
                
                // ভাসমান দোলার জন্য
                this.floatOffset = Math.random() * 100;
            }

            update(time) {
                if (this.delay > 0) {
                    this.delay--;
                    return;
                }
                this.spawned = true;

                if (!this.arrived) {
                    // নিচ থেকে উপরে আসার গতি
                    this.y -= this.speedY;
                    this.x += Math.sin(this.angle) * this.swing;
                    this.angle += 0.05;

                    // ট্রেইল ট্র্যাকিং স্পার্ক
                    if (Math.random() < 0.4) {
                        particles.push(new Particle(this.x, this.y + this.radius, this.color));
                    }

                    // লক্ষ্য স্থানে পৌঁছানোর চেক
                    if (this.y <= this.targetY) {
                        this.arrived = true;
                    }
                } else {
                    // স্থানে পৌঁছানোর পর হালকা দোলনা ইফেক্ট
                    this.x = this.targetX + Math.sin(time * 0.003 + this.floatOffset) * 4;
                    this.y = this.targetY + Math.cos(time * 0.003 + this.floatOffset) * 4;
                }
            }

            draw() {
                if (!this.spawned) return;

                ctx.save();
                
                // বেলুনের সুতা (string)
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + this.radius);
                ctx.lineTo(this.x + Math.sin(this.angle) * 3, this.y + this.radius + 15);
                ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
                ctx.lineWidth = 1;
                ctx.stroke();

                // বেলুন বডি (Glory/Glow Effect)
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fill();

                // বেলুনের গ্লেজ/লাইটিং ইফেক্ট
                ctx.beginPath();
                ctx.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.25, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
                ctx.fill();

                // অক্ষরের লেখা
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#FFFFFF";
                ctx.font = `bold ${this.radius * 1.1}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.char, this.x, this.y + 1);

                ctx.restore();
            }
        }

        function createScene(lines) {
            balloons = [];
            const fontSize = Math.min(width, height) < 600 ? 32 : 44;
            const lineSpacing = fontSize * 1.8;
            const totalHeight = lines.length * lineSpacing;
            const startY = (height - totalHeight) / 2;

            let globalDelay = 0;

            lines.forEach((line, lineIdx) => {
                const charWidth = fontSize * 0.9;
                const totalLineWidth = line.length * charWidth;
                const startX = (width - totalLineWidth) / 2 + charWidth / 2;

                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char !== " ") {
                        const targetX = startX + i * charWidth;
                        const targetY = startY + lineIdx * lineSpacing;
                        // প্রতিটি লেটারের জন্য একটু র‍্যান্ডম রিলিজ টাইম
                        const delay = Math.floor(Math.random() * 30) + (i * 3);
                        balloons.push(new Balloon(char, targetX, targetY, delay));
                    }
                }
            });
        }

        // এনিমেশন লুপ
        let startTime = Date.now();
        createScene(scene1);

        function animate(timestamp) {
            ctx.fillStyle = "rgba(13, 13, 26, 0.3)"; // সুন্দর মোশন ব্লার
            ctx.fillRect(0, 0, width, height);

            // পার্টিকেল আপডেট
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            // বেলুন আপডেট ও ড্র
            balloons.forEach(b => {
                b.update(timestamp);
                b.draw();
            });

            // দৃশ্য পরিবর্তন ট্রানজিশন (৮ সেকেন্ড পর scene 2 এ যাবে)
            if (currentScene === 1 && Date.now() - startTime > 8000) {
                currentScene = 2;
                createScene(scene2);
            }

            requestAnimationFrame(animate);
        }

        animate(0);
    </script>
</body>
</html>
