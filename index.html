<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Taspiya!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .container {
            position: relative;
            padding: 20px;
        }

        .message {
            font-size: 2.5rem;
            font-weight: bold;
            color: #d63384;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.15);
            transition: opacity 1.5s ease-in-out, transform 1.5s ease-in-out;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw;
            max-width: 600px;
        }

        /* প্রথম মেসেজ */
        #first-msg {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* দ্বিতীয় মেসেজ (শুরুতে লুকানো থাকবে) */
        #second-msg {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.8);
            color: #ff1493;
        }

        /* আনিমেটেড হার্ট ইফেক্ট */
        .heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            animation: float 4s linear infinite;
            opacity: 0.7;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="first-msg" class="message">
            Happy Birthday Dear Taspiya ❤️
        </div>
        
        <div id="second-msg" class="message">
            Many many happy returns of the day dear bow jan ummmah 💖😘
        </div>
    </div>

    <script>
        // ৩.৫ সেকেন্ড পর প্রথম মেসেজটি গায়েব হয়ে যাবে এবং দ্বিতীয় মেসেজটি আসবে
        setTimeout(() => {
            const firstMsg = document.getElementById('first-msg');
            const secondMsg = document.getElementById('second-msg');

            // প্রথম মেসেজ হাইড করা
            firstMsg.style.opacity = '0';
            firstMsg.style.transform = 'translate(-50%, -60%) scale(0.8)';

            // দ্বিতীয় মেসেজ শো করা
            setTimeout(() => {
                firstMsg.style.display = 'none';
                secondMsg.style.opacity = '1';
                secondMsg.style.transform = 'translate(-50%, -50%) scale(1.1)';
            }, 1000); // ১ সেকেন্ড ফেড আউট আনিমেসনের সময়

        }, 3500); // ৩.৫ সেকেন্ড পর লেখা পরিবর্তন হবে

        // ব্যাকগ্রাউন্ডে ভাসমান হার্ট তৈরি করার ফাংশন
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            heart.style.fontSize = Math.random() * 15 + 15 + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createHeart, 300);
    </script>
</body>
</html>
