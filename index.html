<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Wish for Taspiya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b1a;
            font-family: 'Arial Black', Gadget, sans-serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10rem;
            color: #ff4081;
            text-shadow: 0 0 20px #ff4081, 0 0 40px #ff0055;
            z-index: 10;
            pointer-events: none;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <div id="countdown">5</div>
    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const countdownEl = document.getElementById('countdown');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if (animationStarted) createScene(currentScene === 1 ? scene1 : scene2);
        });

        const colors = ['#FF2A6D', '#05D54C', '#00F5D4', '#FFB703', '#FB5607', '#FF006E', '#8338EC', '#3A86EF'];

        const scene1 = [
            "HAPPY BIRTHDAY",
            "DEAR TASPIYA ❤️"
        ];

        const scene2 = [
            "MANY MANY RETURNS",
            "OF THE DAY",
            "DEAR BOW JAN UMMMAAHH 💖"
        ];

        let balloons = [];
        let particles = [];
        let currentScene = 1;
        let animationStarted = false;

        // কাউন্টডাউন লজিক (৫ থেকে ১)
        let count = 5;
        const timer = setInterval(() => {
            count--;
            if (count > 0) {
                countdownEl.innerText = count;
            } else {
                clearInterval(timer);
                countdownEl.style.display = 'none';
                startAnimation();
            }
        }, 1000);

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 3 + 1;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = Math.random() * 2 + 1;
                this.alpha = 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.03;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(this.alpha, 0);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class Balloon {
            constructor(char, targetX, targetY, delay, radius) {
                this.char = char;
                this.targetX = targetX;
                this.targetY = targetY;
                this.radius = radius;
                
                this.x = targetX + (Math.random() - 0.5) * (width * 0.5);
                this.y = height + 100 + Math.random() * 200;
                
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.speedY = Math.random() * 3 + 4;
                this.angle = Math.random() * Math.PI * 2;
                this.swing = Math.random() * 2 + 1;
                
                this.arrived = false;
                this.delay = delay;
                this.spawned = false;
                this.floatOffset = Math.random() * 100;
            }

            update(time) {
                if (this.delay > 0) {
                    this.delay--;
                    return;
                }
                this.spawned = true;

                if (!this.arrived) {
                    this.y -= this.speedY;
                    this.x += Math.sin(this.angle) * this.swing;
                    this.angle += 0.05;

                    if (Math.random() < 0.5) {
                        particles.push(new Particle(this.x, this.y + this.radius, this.color));
                    }

                    if (this.y <= this.targetY) {
                        this.arrived = true;
                    }
                } else {
                    this.x = this.targetX + Math.sin(time * 0.003 + this.floatOffset) * 5;
                    this.y = this.targetY + Math.cos(time * 0.003 + this.floatOffset) * 5;
                }
            }

            draw() {
                if (!this.spawned) return;

                ctx.save();
                
                // সুতা
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + this.radius);
                ctx.lineTo(this.x + Math.sin(this.angle) * 4, this.y + this.radius + 18);
                ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // বেলুন
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 12;
                ctx.fill();

                // গ্লেজ
                ctx.beginPath();
                ctx.arc(this.x - this.radius * 0.35, this.y - this.radius * 0.35, this.radius * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
                ctx.fill();

                // স্পষ্ট বড় টেক্সট
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#FFFFFF";
                ctx.font = `900 ${this.radius * 1.1}px Arial, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.char, this.x, this.y + 1);

                ctx.restore();
            }
        }

        function createScene(lines) {
            balloons = [];
            
            // স্ক্রিনের সাইজ অনুযায়ী গতিশীল বেলুন সাইজ হিসাব
            const maxLineLength = Math.max(...lines.map(l => l.length));
            let balloonRadius = Math.min((width * 0.9) / (maxLineLength * 2.2), 30);
            balloonRadius = Math.max(balloonRadius, 14); // সর্বনিম্ন সাইজ

            const lineSpacing = balloonRadius * 2.6;
            const totalHeight = lines.length * lineSpacing;
            const startY = (height - totalHeight) / 2 + balloonRadius;

            lines.forEach((line, lineIdx) => {
                const charSpacing = balloonRadius * 2.2;
                const totalLineWidth = line.length * charSpacing;
                const startX = (width - totalLineWidth) / 2 + charSpacing / 2;

                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char !== " ") {
                        const targetX = startX + i * charSpacing;
                        const targetY = startY + lineIdx * lineSpacing;
                        const delay = Math.floor(Math.random() * 20) + (i * 2);
                        balloons.push(new Balloon(char, targetX, targetY, delay, balloonRadius));
                    }
                }
            });
        }

        let sceneStartTime;
        function startAnimation() {
            animationStarted = true;
            sceneStartTime = Date.now();
            createScene(scene1);
            requestAnimationFrame(animate);
        }

        function animate(timestamp) {
            ctx.fillStyle = "rgba(11, 11, 26, 0.35)";
            ctx.fillRect(0, 0, width, height);

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }

            balloons.forEach(b => {
                b.update(timestamp);
                b.draw();
            });

            // ৭ সেকেন্ড পর Scene 2 আসবে
            if (currentScene === 1 && Date.now() - sceneStartTime > 7000) {
                currentScene = 2;
                createScene(scene2);
            }

            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
